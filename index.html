<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровой Портал</title>
    <!-- Подключаем Tailwind CSS для быстрой стилизации без установки -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Кастомный геймерский скроллбар */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; } /* slate-900 */
        ::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 4px; } /* purple-500 */
        ::-webkit-scrollbar-thumb:hover { background: #a855f7; }
    </style>
</head>
<body class="bg-slate-950 text-slate-300 font-sans min-h-screen pb-20 selection:bg-purple-500 selection:text-white">

    <!-- Hero Секция (Главный экран) -->
    <section class="relative h-[60vh] w-full flex items-center justify-center bg-slate-900 overflow-hidden mb-16">
        <!-- Фоновое изображение (заглушка с Unsplash) -->
        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center opacity-30"></div>
        <!-- Градиентное затемнение -->
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-slate-950"></div>
        
        <div class="relative z-10 text-center max-w-4xl px-4">
            <h1 class="text-5xl md:text-7xl font-extrabold text-white mb-6 tracking-tight">
                Твой портал в <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-cyan-400">Игровые Миры</span>
            </h1>
            <p class="text-lg md:text-xl text-slate-400 mb-8 max-w-2xl mx-auto">
                Скачивай новинки, оценивай классику и собирай свою идеальную библиотеку в один клик.
            </p>
            <button class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-8 rounded-full transition-all hover:shadow-[0_0_30px_rgba(147,51,234,0.6)]">
                Перейти в каталог
            </button>
        </div>
    </section>

    <!-- Секция: Популярные игры -->
    <section class="max-w-7xl mx-auto px-4 md:px-8">
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-3xl font-bold text-white flex items-center gap-3">
                <span class="w-2 h-8 bg-purple-500 rounded-full"></span>
                Популярные новинки
            </h2>
        </div>
        
        <!-- Сетка карточек -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            
            <!-- Карточка Игры 1 -->
            <a href="#" class="group block cursor-pointer">
                <div class="relative overflow-hidden rounded-xl bg-slate-900 border border-slate-800 transition-all duration-300 hover:border-purple-500 hover:shadow-[0_0_20px_rgba(168,85,247,0.4)] hover:-translate-y-1">
                    <div class="relative aspect-[3/4] w-full overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1552820728-8b83bb6b773f?q=80&w=600&auto=format&fit=crop" alt="Cyberpunk City" class="object-cover w-full h-full transition-transform duration-500 group-hover:scale-110">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/40 to-transparent opacity-90"></div>
                    </div>
                    <div class="absolute bottom-0 w-full p-4 transform transition-transform duration-300">
                        <h3 class="text-xl font-bold text-white mb-2 truncate">Neon Rider 2077</h3>
                        <div class="flex items-center justify-between">
                            <div class="flex gap-2 text-xs text-purple-400">
                                <span class="bg-purple-500/20 px-2 py-1 rounded-md">RPG</span>
                                <span class="bg-purple-500/20 px-2 py-1 rounded-md">Action</span>
                            </div>
                            <div class="flex items-center gap-1 bg-slate-950/80 px-2 py-1 rounded-md">
                                <span class="text-yellow-400 text-sm">★</span>
                                <span class="text-white font-semibold text-sm">9.2</span>
                            </div>
                        </div>
                    </div>
                </div>
            </a>

            <!-- Карточка Игры 2 -->
            <a href="#" class="group block cursor-pointer">
                <div class="relative overflow-hidden rounded-xl bg-slate-900 border border-slate-800 transition-all duration-300 hover:border-cyan-500 hover:shadow-[0_0_20px_rgba(34,211,238,0.4)] hover:-translate-y-1">
                    <div class="relative aspect-[3/4] w-full overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?q=80&w=600&auto=format&fit=crop" alt="Space Explorer" class="object-cover w-full h-full transition-transform duration-500 group-hover:scale-110">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/40 to-transparent opacity-90"></div>
                    </div>
                    <div class="absolute bottom-0 w-full p-4 transform transition-transform duration-300">
                        <h3 class="text-xl font-bold text-white mb-2 truncate">Galactic Odyssey</h3>
                        <div class="flex items-center justify-between">
                            <div class="flex gap-2 text-xs text-cyan-400">
                                <span class="bg-cyan-500/20 px-2 py-1 rounded-md">Sci-Fi</span>
                                <span class="bg-cyan-500/20 px-2 py-1 rounded-md">Shooter</span>
                            </div>
                            <div class="flex items-center gap-1 bg-slate-950/80 px-2 py-1 rounded-md">
                                <span class="text-yellow-400 text-sm">★</span>
                                <span class="text-white font-semibold text-sm">8.8</span>
                            </div>
                        </div>
                    </div>
                </div>
            </a>

            <!-- Карточка Игры 3 -->
            <a href="#" class="group block cursor-pointer">
                <div class="relative overflow-hidden rounded-xl bg-slate-900 border border-slate-800 transition-all duration-300 hover:border-green-500 hover:shadow-[0_0_20px_rgba(34,197,94,0.4)] hover:-translate-y-1">
                    <div class="relative aspect-[3/4] w-full overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1605901309584-818e25960b8f?q=80&w=600&auto=format&fit=crop" alt="Fantasy World" class="object-cover w-full h-full transition-transform duration-500 group-hover:scale-110">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/40 to-transparent opacity-90"></div>
                    </div>
                    <div class="absolute bottom-0 w-full p-4 transform transition-transform duration-300">
                        <h3 class="text-xl font-bold text-white mb-2 truncate">Elden Shadow</h3>
                        <div class="flex items-center justify-between">
                            <div class="flex gap-2 text-xs text-green-400">
                                <span class="bg-green-500/20 px-2 py-1 rounded-md">Fantasy</span>
                                <span class="bg-green-500/20 px-2 py-1 rounded-md">Souls-like</span>
                            </div>
                            <div class="flex items-center gap-1 bg-slate-950/80 px-2 py-1 rounded-md">
                                <span class="text-yellow-400 text-sm">★</span>
                                <span class="text-white font-semibold text-sm">9.8</span>
                            </div>
                        </div>
                    </div>
                </div>
            </a>

            <!-- Карточка Игры 4 -->
            <a href="#" class="group block cursor-pointer">
                <div class="relative overflow-hidden rounded-xl bg-slate-900 border border-slate-800 transition-all duration-300 hover:border-red-500 hover:shadow-[0_0_20px_rgba(239,68,68,0.4)] hover:-translate-y-1">
                    <div class="relative aspect-[3/4] w-full overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=600&auto=format&fit=crop" alt="Racing Game" class="object-cover w-full h-full transition-transform duration-500 group-hover:scale-110">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-900/40 to-transparent opacity-90"></div>
                    </div>
                    <div class="absolute bottom-0 w-full p-4 transform transition-transform duration-300">
                        <h3 class="text-xl font-bold text-white mb-2 truncate">Speed Limits</h3>
                        <div class="flex items-center justify-between">
                            <div class="flex gap-2 text-xs text-red-400">
                                <span class="bg-red-500/20 px-2 py-1 rounded-md">Racing</span>
                                <span class="bg-red-500/20 px-2 py-1 rounded-md">Sim</span>
                            </div>
                            <div class="flex items-center gap-1 bg-slate-950/80 px-2 py-1 rounded-md">
                                <span class="text-yellow-400 text-sm">★</span>
                                <span class="text-white font-semibold text-sm">7.5</span>
                            </div>
                        </div>
                    </div>
                </div>
            </a>

        </div>
    </section>

</body>
</html>
