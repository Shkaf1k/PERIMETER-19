<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUNKER: SURVIVAL & MADNESS</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #04060a;
            --panel-bg: rgba(10, 16, 26, 0.88);
            --panel-border: rgba(61, 139, 253, 0.25);
            --panel-border-glow: rgba(0, 242, 254, 0.4);
            --accent-blue: #3d8bfd;
            --accent-cyan: #00f2fe;
            --accent-green: #2ecc71;
            --accent-yellow: #f1c40f;
            --accent-red: #ff4757;
            --accent-purple: #a55eea;
            --text-main: #e6edf3;
            --text-dim: #8b949e;
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-sans);
            color: var(--text-main);
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        canvas#gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at center, transparent 55%, rgba(0, 0, 0, 0.75) 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 100%, 100% 4px;
            pointer-events: none !important;
            z-index: 50;
        }

        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }

        .interactive { pointer-events: auto; }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .stats-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            padding: 12px 18px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .stat-bar-bg {
            width: 60px;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-fill {
            height: 100%;
            width: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .info-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 12px;
            text-align: right;
            font-family: var(--font-mono);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .time-display { font-size: 14px; color: var(--accent-cyan); font-weight: 800; letter-spacing: 1px; }
        .power-display { font-size: 12px; margin-top: 3px; color: var(--accent-green); font-weight: 600; }
        .noise-display { font-size: 11px; color: var(--accent-yellow); margin-top: 2px; }

        .hud-bottom {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hotbar {
            display: flex;
            gap: 8px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .slot {
            width: 54px;
            height: 54px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slot:hover, .slot.selected {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.12);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
        }

        .slot-num { position: absolute; top: 3px; left: 5px; font-size: 10px; color: var(--text-dim); font-family: var(--font-mono); font-weight: 600; }
        .slot-count { position: absolute; bottom: 3px; right: 5px; font-size: 11px; font-weight: 800; color: #fff; font-family: var(--font-mono); }

        .prompt-layer {
            position: absolute;
            top: 58%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 16, 26, 0.95);
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.35);
            padding: 8px 22px;
            border-radius: 20px;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            font-family: var(--font-mono);
            pointer-events: none;
            display: none;
            z-index: 15;
            letter-spacing: 0.5px;
        }

        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 7, 12, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border-glow);
            border-radius: 16px;
            width: 92%;
            max-width: 600px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.85), 0 0 30px rgba(0, 242, 254, 0.15);
        }

        .modal-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .modal-header h2 {
            font-size: 16px;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            font-family: var(--font-mono);
            font-weight: 800;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
            width: 32px; height: 32px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.2s;
        }

        .close-btn:hover { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 13px 20px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            font-family: var(--font-mono);
        }

        .btn:hover {
            background: var(--accent-blue);
            color: #fff;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(61, 139, 253, 0.4);
        }

        #main-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 40;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            background: radial-gradient(circle at center, #0d1826 0%, #04070c 100%);
        }

        .menu-title { text-align: center; }
        .menu-title h1 {
            font-size: 48px;
            letter-spacing: 10px;
            color: #fff;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.5);
            font-family: var(--font-mono);
            font-weight: 800;
        }
        .menu-title p {
            color: var(--accent-cyan);
            font-size: 12px;
            letter-spacing: 4px;
            margin-top: 10px;
            font-family: var(--font-mono);
            opacity: 0.8;
        }

        .menu-btns { width: 320px; }

        .inv-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .inv-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            min-height: 70px;
        }

        .inv-item:hover, .inv-item.selected {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.08);
        }

        .inv-item .icon { font-size: 24px; margin-bottom: 2px; }
        .inv-item .name { font-size: 10px; text-align: center; color: var(--text-dim); line-height: 1.1; }
        .inv-item .qty { position: absolute; top: 3px; right: 6px; font-size: 10px; font-weight: 800; font-family: var(--font-mono); }

        .item-desc {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--panel-border);
            padding: 14px;
            border-radius: 8px;
            font-size: 12px;
            min-height: 65px;
            color: var(--text-dim);
            line-height: 1.4;
        }

        .notification {
            position: absolute;
            top: 75px; left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(10, 16, 26, 0.95);
            border: 1px solid var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 150;
            font-family: var(--font-mono);
        }

        .notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div id="game-container">
    <div class="crt-overlay"></div>
    <canvas id="gameCanvas"></canvas>

    <div class="ui-layer">
        <div class="hud-top">
            <div class="stats-panel interactive">
                <div class="stat-item" title="Здоровье">
                    ❤️ <div class="stat-bar-bg"><div id="hp-fill" class="stat-fill" style="background: var(--accent-red);"></div></div>
                </div>
                <div class="stat-item" title="Голод">

                </div>
                <div class="stat-item" title="Жажда">
                    💧 <div class="stat-bar-bg"><div id="thirst-fill" class="stat-fill" style="background: var(--accent-blue);"></div></div>
                </div>
                <div class="stat-item" title="Энергия">
                    ⚡ <div class="stat-bar-bg"><div id="stamina-fill" class="stat-fill" style="background: var(--accent-green);"></div></div>
                </div>
                <div class="stat-item" title="Рассудок">
                    🧠 <div class="stat-bar-bg"><div id="sanity-fill" class="stat-fill" style="background: var(--accent-purple);"></div></div>
                </div>
            </div>

            <div class="info-panel interactive">
                <div class="time-display" id="time-display">ДЕНЬ 1 — 08:00</div>
                <div class="power-display" id="power-display">ЭЛЕКТРИЧЕСТВО: 100%</div>
                <div class="noise-display" id="noise-display">ШУМ: 0%</div>
            </div>
        </div>

        <div class="prompt-layer" id="interaction-prompt">[E] ВЗАИМОДЕЙСТВИЕ</div>

        <div class="hud-bottom">
            <div class="hotbar interactive" id="hotbar"></div>
        </div>
    </div>

    <div class="notification" id="notification">Уведомление</div>

    <div id="main-menu">
        <div class="menu-title">
            <h1>BUNKER: SURVIVAL</h1>
            <p>PROTOCOL 0 — UNKNOWN MADNESS</p>
        </div>
        <div class="btn-group menu-btns">
            <button class="btn" id="btn-new-game">▶ Начать Смену</button>
            <button class="btn" id="btn-controls">▶ Управление</button>
            <button class="btn" id="btn-about">▶ Справка</button>
        </div>
    </div>

    <div class="modal" id="modal-pause">
        <div class="modal-box" style="max-width: 380px;">
            <div class="modal-header">
                <h2>Пауза</h2>
            </div>
            <div class="modal-body">
                <div class="btn-group">
                    <button class="btn" onclick="UI.resumeGame()">Продолжить</button>
                    <button class="btn" onclick="UI.quitToMenu()" style="background: rgba(255, 71, 87, 0.15); border-color: var(--accent-red);">Выйти в меню</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal-inventory">
        <div class="modal-box">
            <div class="modal-header">
                <h2>Инвентарь & Лаборатория</h2>
                <button class="close-btn" onclick="UI.closeModals()">✕</button>
            </div>
            <div class="modal-body">
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button class="btn" style="flex:1" onclick="UI.switchInvTab('inv')">Предметы</button>
                    <button class="btn" style="flex:1" onclick="UI.switchInvTab('craft')">Крафтинг</button>
                </div>

                <div id="tab-inv">
                    <div class="inv-grid" id="inv-grid"></div>
                    <div class="item-desc" id="inv-desc">Выберите предмет для просмотра или использования.</div>
                    <button class="btn" id="btn-use-item" style="width:100%; margin-top:10px; display:none;" onclick="UI.useSelectedItem()">Использовать</button>
                </div>

                <div id="tab-craft" style="display: none;">
                    <div class="item-desc" style="margin-bottom:12px;">Верстак: Выберите чертеж для сборки.</div>
                    <div class="btn-group" id="craft-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal-info">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="info-title">Информация</h2>
                <button class="close-btn" onclick="UI.closeModals()">✕</button>
            </div>
            <div class="modal-body" id="info-body"></div>
        </div>
    </div>
</div>

<script>
const Audio = {
    ctx: null,
    volume: 0.8,
    init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    },
    playTone(freq, type, duration) {
        if (!this.ctx) return;
        try {
            let osc = this.ctx.createOscillator();
            let gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(this.volume * 0.08, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch(e){}
    },
    playInteract() { this.playTone(650, 'sine', 0.08); },
    playClick() { this.playTone(400, 'triangle', 0.05); },
    playStrangeNoise() { this.playTone(120 + Math.random() * 80, 'sawtooth', 0.4); }
};

// БОЛЬШОЙ БАЗАР ПРЕДМЕТОВ

    water: { name: 'Чистая Вода', icon: '💧', desc: 'Запечатанная бутылка. +40 Жажды.', type: 'drink', value: 40 },
    soda: { name: 'Газировка', icon: '🥤', desc: 'Химозный напиток. +25 Жажды, +15 Энергии.', type: 'drink_plus', value: 25 },

    diary: { name: 'Старый Дневник', icon: '📓', desc: 'Запись: "Они смотрят сквозь вентиляцию..."', type: 'lore' },
    fuel: { name: 'Канистра Топлива', icon: '⛽', desc: 'Топливо для генератора. +50% Тока.', type: 'fuel', value: 50 }

    { result: 'lockpick', req: { metal: 3, wire: 1 }, name: '🔑 Отмычка (3x Металл, 1x Провода)' },

const CONFIG = { tileSize: 40 };
const MAP_WIDTH = 26;
const MAP_HEIGHT = 26;

let Game = {
    running: false,
    paused: false,
    timeMinutes: 480,
    day: 1,
    power: 100,
    noise: 5,
    selectedInvIndex: null,
    player: {
        x: 13, y: 13,
        dirX: 0, dirY: 1,
        speed: 4.5,

        hunger: 90,

        stamina: 100,
        sanity: 100

    inventory: [
        { item: 'canned_food', count: 3 },
        { item: 'water', count: 3 },
        { item: 'pills', count: 2 },
        { item: 'metal', count: 8 },
        { item: 'wire', count: 5 },
        { item: 'gears', count: 4 },
        { item: 'strange_artifact', count: 1 },
        { item: 'rubber_duck', count: 1 }
    ],
    selectedSlot: 0
};

let mapGrid = [];
let rooms = [];
let interactiveObjects = [];

function initMap() {
    mapGrid = Array(MAP_HEIGHT).fill(0).map(() => Array(MAP_WIDTH).fill(1));
    
    rooms = [
        { name: 'ЖИЛОЙ БЛОК', x: 3, y: 3, w: 20, h: 5 },
        { name: 'СКЛАД ПРИПАСОВ', x: 3, y: 10, w: 9, h: 6 },
        { name: 'ЛАБОРАТОРИЯ', x: 14, y: 10, w: 9, h: 6 },
        { name: 'ГЕНЕРАТОРНАЯ И РАДИО', x: 3, y: 18, w: 20, h: 5 }
    ];

    rooms.forEach(r => {
        for (let y = r.y; y < r.y + r.h; y++) {
            for (let x = r.x; x < r.x + r.w; x++) {
                mapGrid[y][x] = 0;
            }
        }
    });

    for (let y = 3; y < 23; y++) {
        mapGrid[y][12] = 0;
        mapGrid[y][13] = 0;
    }

    interactiveObjects = [
        { id: 'bed', name: 'Кровать (Отдых)', x: 5, y: 5.5, type: 'bed', icon: '🛏️' },
        { id: 'workbench', name: 'Верстак', x: 20.5, y: 12.5, type: 'workbench', icon: '🛠️' },
        { id: 'generator', name: 'Генератор', x: 6, y: 20.5, type: 'generator', icon: '⚡' },
        { id: 'radio', name: 'Радиостанция', x: 20, y: 20.5, type: 'radio', icon: '📻' },
        { id: 'chest1', name: 'Ящик с ломом', x: 5, y: 12.5, type: 'chest', icon: '📦' },
        { id: 'chest2', name: 'Медицинский шкаф', x: 16, y: 12.5, type: 'med_chest', icon: '🩺' },
        { id: 'vent', name: 'Подозрительная Вентиляция', x: 13, y: 4, type: 'vent', icon: '🕳️' }
    ];
}

const Keys = {};
window.addEventListener('keydown', e => {
    Keys[e.code] = true;
    if (e.code === 'Escape' && Game.running) {
        if (Game.paused) UI.resumeGame();
        else UI.pauseGame();
    }
    if (!Game.running || Game.paused) return;

    if (e.code === 'KeyE') interactNear();
    if (e.code === 'KeyI') UI.toggleModal('modal-inventory');

    if (e.code.startsWith('Digit')) {
        let num = parseInt(e.code.replace('Digit', '')) - 1;
        if (num >= 0 && num < 5) UI.selectSlot(num);
    }
});
window.addEventListener('keyup', e => { Keys[e.code] = false; });

function interactNear() {
    let near = getNearbyObject();
    if (!near) return;

    Audio.playInteract();
    if (near.type === 'bed') {
        Game.player.stamina = 100;
        Game.player.sanity = Math.min(100, Game.player.sanity + 15);
        Game.timeMinutes += 120;
        UI.notify('Вы поспали (+100% Энергии, +15% Рассудка)');
    } else if (near.type === 'workbench') {
        UI.toggleModal('modal-inventory');
        UI.switchInvTab('craft');
    } else if (near.type === 'generator') {
        Game.power = 100;
        UI.notify('Генератор заправлен и отрегулирован');
    } else if (near.type === 'radio') {
        Audio.playStrangeNoise();
        let msgs = [
            'Радио шипит: "...они уже на третьем уровне..."',
            'Шум помех... Слышен чья-то мольба о помощи.',
            'В эфире тишина, но кто-то ритмично стучит по микрофону.'
        ];
        UI.notify(msgs[Math.floor(Math.random() * msgs.length)]);
    } else if (near.type === 'chest') {
        addItemToInv('metal', 2);
        addItemToInv('wire', 1);
        UI.notify('Найдено: Металл x2, Провода x1');
    } else if (near.type === 'med_chest') {
        addItemToInv('pills', 1);
        UI.notify('Найдено: Успокоительное x1');
    } else if (near.type === 'vent') {
        Audio.playStrangeNoise();
        Game.player.sanity -= 10;
        UI.notify('Из вентиляции раздался жуткий шепот! (-10% Рассудка)');
    }
}

function addItemToInv(itemId, count = 1) {
    let existing = Game.inventory.find(i => i.item === itemId);
    if (existing) existing.count += count;
    else Game.inventory.push({ item: itemId, count: count });
}

function getNearbyObject() {
    return interactiveObjects.find(o => Math.hypot(o.x - Game.player.x, o.y - Game.player.y) < 1.6);
}

function update(dt) {
    if (!Game.running || Game.paused) return;

    // Время и потребности
    Game.timeMinutes += dt * 3;
    if (Game.timeMinutes >= 1440) {
        Game.timeMinutes = 0;
        Game.day++;
    }

    Game.player.hunger = Math.max(0, Game.player.hunger - dt * 0.4);
    Game.player.thirst = Math.max(0, Game.player.thirst - dt * 0.6);
    Game.power = Math.max(0, Game.power - dt * 0.3);

    // Падение рассудка в темноте
    if (Game.power < 20) {
        Game.player.sanity = Math.max(0, Game.player.sanity - dt * 1.5);
    }

    // Случайная дичь
    if (Math.random() < 0.001) {
        Audio.playStrangeNoise();
        UI.notify('⚠️ По стенам бункера прошёл странный гул...');
    }

    // Движение
    let dx = 0, dy = 0;
    if (Keys['KeyW'] || Keys['ArrowUp']) dy -= 1;
    if (Keys['KeyS'] || Keys['ArrowDown']) dy += 1;
    if (Keys['KeyA'] || Keys['ArrowLeft']) dx -= 1;
    if (Keys['KeyD'] || Keys['ArrowRight']) dx += 1;

    if (dx !== 0 || dy !== 0) {
        let len = Math.hypot(dx, dy);
        dx /= len; dy /= len;
        Game.player.dirX = dx;
        Game.player.dirY = dy;

        let nextX = Game.player.x + dx * Game.player.speed * dt;
        let nextY = Game.player.y + dy * Game.player.speed * dt;

        if (mapGrid[Math.floor(Game.player.y)][Math.floor(nextX)] === 0) Game.player.x = nextX;
        if (mapGrid[Math.floor(nextY)][Math.floor(Game.player.x)] === 0) Game.player.y = nextY;
    }

    let prompt = document.getElementById('interaction-prompt');
    let near = getNearbyObject();
    if (near) {
        prompt.style.display = 'block';
        prompt.innerText = `[E] ${near.name.toUpperCase()}`;
    } else {
        prompt.style.display = 'none';
    }

    UI.updateHUD();
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!Game.running) return;

    let tileSize = CONFIG.tileSize;
    let camX = canvas.width / 2 - Game.player.x * tileSize;
    let camY = canvas.height / 2 - Game.player.y * tileSize;

    ctx.save();
    ctx.translate(camX, camY);

    // Карта
    for (let r = 0; r < MAP_HEIGHT; r++) {
        for (let c = 0; c < MAP_WIDTH; c++) {
            if (mapGrid[r][c] === 1) {
                ctx.fillStyle = '#060a10';
                ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
                ctx.strokeStyle = '#0e1824';
                ctx.lineWidth = 1;
                ctx.strokeRect(c * tileSize, r * tileSize, tileSize, tileSize);
            } else {
                ctx.fillStyle = '#0b121c';
                ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize);
                ctx.fillStyle = 'rgba(255,255,255,0.012)';
                ctx.fillRect(c * tileSize + 1, r * tileSize + 1, tileSize - 2, tileSize - 2);
            }
        }
    }

    // Зоны
    ctx.font = 'bold 10px "JetBrains Mono"';
    ctx.fillStyle = 'rgba(0, 242, 254, 0.25)';
    ctx.textAlign = 'center';
    rooms.forEach(r => {
        ctx.fillText(r.name, (r.x + r.w / 2) * tileSize, (r.y + 1) * tileSize);
    });

    // Объекты
    interactiveObjects.forEach(obj => {
        let ox = obj.x * tileSize;
        let oy = obj.y * tileSize;

        ctx.fillStyle = 'rgba(61, 139, 253, 0.12)';
        ctx.strokeStyle = 'rgba(0, 242, 254, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(ox, oy, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.font = '18px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(obj.icon, ox, oy);
    });

    // Свет и Галлюцинации при низком рассудке
    let px = Game.player.x * tileSize;
    let py = Game.player.y * tileSize;

    let lightRadius = Game.power > 10 ? 160 : 70;
    let grad = ctx.createRadialGradient(px, py, 5, px, py, lightRadius);
    grad.addColorStop(0, Game.player.sanity < 30 ? 'rgba(255, 71, 87, 0.3)' : 'rgba(0, 242, 254, 0.25)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(px, py, lightRadius, 0, Math.PI * 2);
    ctx.fill();

    // Персонаж
    ctx.fillStyle = Game.player.sanity < 40 ? '#ff4757' : '#00f2fe';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(px, py, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Взгляд
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(px + Game.player.dirX * 18, py + Game.player.dirY * 18);
    ctx.stroke();

    ctx.restore();
}

let lastTime = performance.now();
function gameLoop(time) {
    let dt = (time - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1;
    lastTime = time;

    update(dt);
    render();

    requestAnimationFrame(gameLoop);
}

const UI = {
    updateHUD() {
        document.getElementById('hp-fill').style.width = `${Game.player.hp}%`;
        document.getElementById('hunger-fill').style.width = `${Game.player.hunger}%`;
        document.getElementById('thirst-fill').style.width = `${Game.player.thirst}%`;
        document.getElementById('stamina-fill').style.width = `${Game.player.stamina}%`;
        document.getElementById('sanity-fill').style.width = `${Game.player.sanity}%`;

        let hrs = Math.floor(Game.timeMinutes / 60).toString().padStart(2, '0');
        let mins = Math.floor(Game.timeMinutes % 60).toString().padStart(2, '0');
        document.getElementById('time-display').innerText = `ДЕНЬ ${Game.day} — ${hrs}:${mins}`;
        document.getElementById('power-display').innerText = `ЭЛЕКТРИЧЕСТВО: ${Math.round(Game.power)}%`;
    },
    renderHotbar() {
        let hotbar = document.getElementById('hotbar');
        hotbar.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            let slotData = Game.inventory[i];
            let item = slotData ? ITEMS[slotData.item] : null;
            let div = document.createElement('div');
            div.className = `slot ${i === Game.selectedSlot ? 'selected' : ''}`;
            div.onclick = () => this.selectSlot(i);
            div.innerHTML = `
                <span class="slot-num">${i + 1}</span>
                ${item ? `<span style="font-size: 22px;">${item.icon}</span><span class="slot-count">${slotData.count}</span>` : ''}
            `;
            hotbar.appendChild(div);
        }
    },
    selectSlot(idx) {
        Game.selectedSlot = idx;
        this.renderHotbar();
    },
    renderInventory() {
        let grid = document.getElementById('inv-grid');
        grid.innerHTML = '';
        Game.inventory.forEach((slot, idx) => {
            let item = ITEMS[slot.item];
            if (!item) return;
            let div = document.createElement('div');
            div.className = `inv-item ${Game.selectedInvIndex === idx ? 'selected' : ''}`;
            div.innerHTML = `<span class="qty">x${slot.count}</span><div class="icon">${item.icon}</div><div class="name">${item.name}</div>`;
            div.onclick = () => {
                Game.selectedInvIndex = idx;
                this.renderInventory();
                document.getElementById('inv-desc').innerText = `${item.name}: ${item.desc}`;
                let useBtn = document.getElementById('btn-use-item');
                if (['food','food_plus','drink','drink_plus','heal','mind','risky_food'].includes(item.type)) {
                    useBtn.style.display = 'block';
                } else {
                    useBtn.style.display = 'none';
                }
            };
            grid.appendChild(div);
        });
    },
    useSelectedItem() {
        if (Game.selectedInvIndex === null) return;
        let slot = Game.inventory[Game.selectedInvIndex];
        if (!slot) return;
        let item = ITEMS[slot.item];

        if (item.type === 'food') Game.player.hunger = Math.min(100, Game.player.hunger + item.value);
        if (item.type === 'food_plus') { Game.player.hunger = Math.min(100, Game.player.hunger + item.value); Game.player.stamina = 100; }
        if (item.type === 'drink') Game.player.thirst = Math.min(100, Game.player.thirst + item.value);
        if (item.type === 'heal') Game.player.hp = Math.min(100, Game.player.hp + item.value);
        if (item.type === 'mind') Game.player.sanity = Math.min(100, Game.player.sanity + item.value);
        if (item.type === 'risky_food') { Game.player.hunger += 15; Game.player.sanity -= 10; }

        slot.count--;
        if (slot.count <= 0) Game.inventory.splice(Game.selectedInvIndex, 1);
        Game.selectedInvIndex = null;
        
        document.getElementById('btn-use-item').style.display = 'none';
        document.getElementById('inv-desc').innerText = 'Предмет использован.';
        this.renderInventory();
        this.renderHotbar();
    },
    switchInvTab(tab) {
        document.getElementById('tab-inv').style.display = tab === 'inv' ? 'block' : 'none';
        document.getElementById('tab-craft').style.display = tab === 'craft' ? 'block' : 'none';
        if (tab === 'craft') this.renderCrafting();
    },
    renderCrafting() {
        let list = document.getElementById('craft-list');
        list.innerHTML = '';
        CRAFT_RECIPES.forEach((rec, idx) => {
            let btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = rec.name;
            btn.onclick = () => this.craftItem(rec);
            list.appendChild(btn);
        });
    },
    craftItem(rec) {
        // Проверка компонентов
        let canCraft = true;
        for (let reqMat in rec.req) {
            let has = Game.inventory.find(i => i.item === reqMat);
            if (!has || has.count < rec.req[reqMat]) canCraft = false;
        }

        if (canCraft) {
            for (let reqMat in rec.req) {
                let has = Game.inventory.find(i => i.item === reqMat);
                has.count -= rec.req[reqMat];
            }
            addItemToInv(rec.result, 1);
            UI.notify('Скрафчено: ' + ITEMS[rec.result].name);
            this.renderInventory();
            this.renderHotbar();
        } else {
            UI.notify('❌ Не хватает материалов!');
        }
    },
    notify(text) {
        let el = document.getElementById('notification');
        el.innerText = text;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2400);
    },
    toggleModal(id) {
        let el = document.getElementById(id);
        let isActive = el.classList.contains('active');
        this.closeModals();
        if (!isActive) {
            el.classList.add('active');
            Game.paused = true;
            if (id === 'modal-inventory') {
                this.renderInventory();
                this.switchInvTab('inv');
            }
        } else {
            if (Game.running) Game.paused = false;
        }
    },
    closeModals() {
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        if (Game.running) Game.paused = false;
    },
    pauseGame() {
        if (!Game.running) return;
        Game.paused = true;
        document.getElementById('modal-pause').classList.add('active');
    },
    resumeGame() {
        document.getElementById('modal-pause').classList.remove('active');
        Game.paused = false;
    },
    quitToMenu() {
        this.closeModals();
        Game.running = false;
        Game.paused = false;
        document.getElementById('main-menu').style.display = 'flex';
    },
    showInfo(title, html) {
        document.getElementById('info-title').innerText = title;
        document.getElementById('info-body').innerHTML = html;
        this.toggleModal('modal-info');
    }
};

window.addEventListener('DOMContentLoaded', () => {
    UI.renderHotbar();
    
    document.getElementById('btn-new-game').onclick = () => {
        Audio.init();
        initMap();
        document.getElementById('main-menu').style.display = 'none';
        UI.closeModals();
        Game.running = true;
        Game.paused = false;
        requestAnimationFrame(gameLoop);
    };

    document.getElementById('btn-controls').onclick = () => { 
        Audio.playClick(); 
        UI.showInfo('УПРАВЛЕНИЕ', '<p><b>WASD / Стрелки</b> — Движение<br><b>E</b> — Взаимодействие<br><b>I</b> — Инвентарь и верстак<br><b>1-5</b> — Выбор слотов<br><b>ESC</b> — Пауза</p>'); 
    };
    
    document.getElementById('btn-about').onclick = () => { 
        Audio.playClick(); 
        UI.showInfo('О БУНКЕРЕ', '<p>Следите за шкалой <b>Рассудка 🧠</b>. Если электричество отключится, в темноте вы начнёте слышать вещи, которых нет...</p>'); 
    };
});
