<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUNKER 3D: SURVIVAL</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --panel-bg: rgba(10, 16, 26, 0.88);
            --panel-border: rgba(61, 139, 253, 0.25);
            --panel-border-glow: rgba(0, 242, 254, 0.4);
            --accent-blue: #3d8bfd;
            --accent-cyan: #00f2fe;
            --accent-green: #2ecc71;
            --accent-yellow: #f1c40f;
            --accent-red: #ff4757;
            --accent-purple: #a55eea;
            --text-main: #e6edf3;
            --text-dim: #8b949e;
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: var(--font-sans);
            color: var(--text-main);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at center, transparent 60%, rgba(0, 0, 0, 0.8) 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
            background-size: 100% 100%, 100% 4px;
            pointer-events: none !important;
            z-index: 50;
        }

        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }

        .interactive { pointer-events: auto; }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stats-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            padding: 12px 18px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .stat-bar-bg {
            width: 60px;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-fill {
            height: 100%;
            width: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .info-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: 12px;
            text-align: right;
            font-family: var(--font-mono);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .time-display { font-size: 14px; color: var(--accent-cyan); font-weight: 800; }
        .power-display { font-size: 12px; margin-top: 3px; color: var(--accent-green); font-weight: 600; }

        .hud-bottom {
            display: flex;
            justify-content: center;
        }

        .hotbar {
            display: flex;
            gap: 8px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            padding: 8px;
            border-radius: 12px;
        }

        .slot {
            width: 54px;
            height: 54px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        .slot.selected {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.12);
        }

        .slot-num { position: absolute; top: 3px; left: 5px; font-size: 10px; color: var(--text-dim); font-family: var(--font-mono); }
        .slot-count { position: absolute; bottom: 3px; right: 5px; font-size: 11px; font-weight: 800; color: #fff; font-family: var(--font-mono); }

        .prompt-layer {
            position: absolute;
            top: 55%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 16, 26, 0.95);
            border: 1px solid var(--accent-cyan);
            padding: 8px 22px;
            border-radius: 20px;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            font-family: var(--font-mono);
            display: none;
            z-index: 15;
        }

        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 7, 12, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border-glow);
            border-radius: 16px;
            width: 90%;
            max-width: 580px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 { font-size: 15px; letter-spacing: 2px; color: #fff; font-family: var(--font-mono); }
        .close-btn { background: none; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; }
        .close-btn:hover { color: #fff; }

        .modal-body { padding: 20px; overflow-y: auto; flex-grow: 1; }

        .btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            font-family: var(--font-mono);
            width: 100%;
            margin-bottom: 8px;
        }

        .btn:hover { background: var(--accent-blue); color: #fff; border-color: var(--accent-cyan); }

        #main-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            background: radial-gradient(circle at center, #0d1826 0%, #04070c 100%);
        }

        .menu-title h1 { font-size: 42px; letter-spacing: 8px; color: #fff; font-family: var(--font-mono); font-weight: 800; text-align: center;}
        .menu-title p { color: var(--accent-cyan); font-size: 12px; letter-spacing: 3px; text-align: center; margin-top: 8px; font-family: var(--font-mono); }
        .menu-btns { width: 280px; }

        .inv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
        .inv-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            position: relative;
        }
        .inv-item.selected { border-color: var(--accent-cyan); background: rgba(0, 242, 254, 0.1); }
        .inv-item .icon { font-size: 24px; }
        .inv-item .name { font-size: 10px; color: var(--text-dim); text-align: center; margin-top: 4px; }
        .inv-item .qty { position: absolute; top: 3px; right: 6px; font-size: 10px; font-weight: 800; font-family: var(--font-mono); }

        .item-desc {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--panel-border);
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-dim);
            min-height: 50px;
        }

        .notification {
            position: absolute;
            top: 75px; left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(10, 16, 26, 0.95);
            border: 1px solid var(--accent-cyan);
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 150;
            font-family: var(--font-mono);
        }
        .notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>
<div class="crt-overlay"></div>

<div class="ui-layer">
    <div class="hud-top">
        <div class="stats-panel interactive">
            <div class="stat-item" title="Здоровье">❤️ <div class="stat-bar-bg"><div id="hp-fill" class="stat-fill" style="background: var(--accent-red);"></div></div></div>
            <div class="stat-item" title="Голод">🍗 <div class="stat-bar-bg"><div id="hunger-fill" class="stat-fill" style="background: var(--accent-yellow);"></div></div></div>
            <div class="stat-item" title="Жажда">💧 <div class="stat-bar-bg"><div id="thirst-fill" class="stat-fill" style="background: var(--accent-blue);"></div></div></div>
            <div class="stat-item" title="Рассудок">🧠 <div class="stat-bar-bg"><div id="sanity-fill" class="stat-fill" style="background: var(--accent-purple);"></div></div></div>
        </div>

        <div class="info-panel interactive">
            <div class="time-display" id="time-display">ДЕНЬ 1 — 08:00</div>
            <div class="power-display" id="power-display">ЭЛЕКТРИЧЕСТВО: 100%</div>
        </div>
    </div>

    <div class="prompt-layer" id="interaction-prompt">[E] ВЗАИМОДЕЙСТВИЕ</div>

    <div class="hud-bottom">
        <div class="hotbar interactive" id="hotbar"></div>
    </div>
</div>

<div class="notification" id="notification">Уведомление</div>

<div id="main-menu">
    <div class="menu-title">
        <h1>BUNKER 3D</h1>
        <p>3D SURVIVAL EXPERIENCE</p>
    </div>
    <div class="menu-btns">
        <button class="btn" id="btn-start">▶ Войти в Бункер</button>
    </div>
</div>

<div class="modal" id="modal-inventory">
    <div class="modal-box">
        <div class="modal-header">
            <h2>Инвентарь & Крафт</h2>
            <button class="close-btn" onclick="UI.closeModals()">✕</button>
        </div>
        <div class="modal-body">
            <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                <button class="btn" style="flex:1" onclick="UI.switchInvTab('inv')">Предметы</button>
                <button class="btn" style="flex:1" onclick="UI.switchInvTab('craft')">Крафт</button>
            </div>
            <div id="tab-inv">
                <div class="inv-grid" id="inv-grid"></div>
                <div class="item-desc" id="inv-desc">Выберите предмет...</div>
                <button class="btn" id="btn-use-item" style="margin-top:10px; display:none;" onclick="UI.useSelectedItem()">Использовать</button>
            </div>
            <div id="tab-craft" style="display: none;">
                <div id="craft-list"></div>
            </div>
        </div>
    </div>
</div>

<script>
const ITEMS = {
    canned_food: { name: 'Консервы', icon: '🥫', desc: '+35 Голода', type: 'food', value: 35 },
    water: { name: 'Вода', icon: '💧', desc: '+40 Жажды', type: 'drink', value: 40 },
    pills: { name: 'Успокоительное', icon: '💊', desc: '+40 Рассудка', type: 'mind', value: 40 },
    metal: { name: 'Металл', icon: '🔩', desc: 'Материал', type: 'mat' },
    wire: { name: 'Провода', icon: '🔌', desc: 'Материал', type: 'mat' },
    gears: { name: 'Шестерни', icon: '⚙️', desc: 'Материал', type: 'mat' },
    medkit: { name: 'Аптечка', icon: '🩹', desc: '+50 Здоровья', type: 'heal', value: 50 }
};

const CRAFT_RECIPES = [
    { result: 'medkit', req: { metal: 2, pills: 1 }, name: '🩹 Аптечка (2x Металл, 1x Успокоительное)' }
];

let Game = {
    running: false,
    paused: false,
    timeMinutes: 480,
    day: 1,
    power: 100,
    player: { x: 0, z: 0, rot: 0, hp: 100, hunger: 90, thirst: 80, sanity: 100 },
    inventory: [
        { item: 'canned_food', count: 3 },
        { item: 'water', count: 2 },
        { item: 'pills', count: 1 },
        { item: 'metal', count: 5 }
    ],
    selectedSlot: 0,
    selectedInvIndex: null
};

// --- THREE.JS ENGINE SETUP ---
let scene, camera, renderer;
let playerMesh, flashlight;
let interactiveMeshes = [];
const keys = {};

function init3D() {
    const container = document.getElementById('canvas-container');
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020408);
    scene.fog = new THREE.FogExp2(0x020408, 0.08);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Освещение окружения
    const ambientLight = new THREE.AmbientLight(0x1a2636, 0.2);
    scene.add(ambientLight);

    buildBunkerLayout();
    createPlayer();

    window.addEventListener('resize', onWindowResize);
}

function buildBunkerLayout() {
    // Текстуры/материалы
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5 });
    
    // Пол
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Функция создания стен
    function createWall(x, z, w, d, h=4) {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
        wall.position.set(x, h/2, z);
        wall.castShadow = true;
        wall.receiveShadow = true;
        scene.add(wall);
    }

    // Периметр
    createWall(0, -15, 30, 1);
    createWall(0, 15, 30, 1);
    createWall(-15, 0, 1, 30);
    createWall(15, 0, 1, 30);

    // Внутренние перегородки
    createWall(-5, -5, 1, 20);
    createWall(5, 5, 1, 20);

    // Интерактивные объекты (3D)
    createInteractiveObj(0, 0, -12, 0x3b82f6, 'bed', 'Кровать (Отдых)', '🛏️');
    createInteractiveObj(-10, 0, 10, 0xeab308, 'generator', 'Генератор', '⚡');
    createInteractiveObj(10, 0, -10, 0x10b981, 'workbench', 'Верстак', '🛠️️');
    createInteractiveObj(10, 0, 10, 0xa855f7, 'radio', 'Радиостанция', '📻');

    // Лампы под потолком
    addCeilingLight(0, 3.5, 0, 0x00f2fe, 1.2);
    addCeilingLight(-10, 3.5, 10, 0xf1c40f, 1.5);
    addCeilingLight(10, 3.5, -10, 0x2ecc71, 1.5);
}

function addCeilingLight(x, y, z, color, intensity) {
    const light = new THREE.PointLight(color, intensity, 15);
    light.position.set(x, y, z);
    light.castShadow = true;
    scene.add(light);

    const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(0.2, 8, 8),
        new THREE.MeshBasicMaterial({ color: color })
    );
    bulb.position.set(x, y, z);
    scene.add(bulb);
}

function createInteractiveObj(x, y, z, color, type, name, icon) {
    const group = new THREE.Group();
    const geo = new THREE.BoxGeometry(1.8, 1.2, 1.8);
    const mat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.3, roughness: 0.4 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = 0.6;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    group.add(mesh);
    group.position.set(x, y, z);
    scene.add(group);

    interactiveMeshes.push({ group, type, name, icon, x, z });
}

function createPlayer() {
    playerMesh = new THREE.Group();

    // Тело
    const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.6, 12);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3d8bfd });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.8;
    body.castShadow = true;
    playerMesh.add(body);

    // Голова
    const headGeo = new THREE.SphereGeometry(0.3, 12, 12);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffccaa });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.8;
    playerMesh.add(head);

    // Фонарик игрока
    flashlight = new THREE.SpotLight(0xffffff, 2, 18, Math.PI / 5, 0.5, 1);
    flashlight.position.set(0, 1.6, 0);
    flashlight.target.position.set(0, 1.6, 5);
    flashlight.castShadow = true;
    playerMesh.add(flashlight);
    playerMesh.add(flashlight.target);

    scene.add(playerMesh);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

// --- ИГРОВАЯ ЛОГИКА И УПРАВЛЕНИЕ ---
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyE') checkInteraction();
    if (e.code === 'KeyI') UI.toggleModal('modal-inventory');
});
window.addEventListener('keyup', e => keys[e.code] = false);

function updateGame(dt) {
    if (!Game.running || Game.paused) return;

    // Таймеры
    Game.timeMinutes += dt * 4;
    if (Game.timeMinutes >= 1440) { Game.timeMinutes = 0; Game.day++; }
    Game.player.hunger = Math.max(0, Game.player.hunger - dt * 0.3);
    Game.player.thirst = Math.max(0, Game.player.thirst - dt * 0.5);
    Game.power = Math.max(0, Game.power - dt * 0.2);

    // Перемещение игрока
    const moveSpeed = 6 * dt;
    let moveX = 0, moveZ = 0;

    if (keys['KeyW'] || keys['ArrowUp']) moveZ += 1;
    if (keys['KeyS'] || keys['ArrowDown']) moveZ -= 1;
    if (keys['KeyA'] || keys['ArrowLeft']) moveX += 1;
    if (keys['KeyD'] || keys['ArrowRight']) moveX -= 1;

    if (moveX !== 0 || moveZ !== 0) {
        const angle = Math.atan2(moveX, moveZ);
        Game.player.rot = angle;
        
        const nextX = Game.player.x + Math.sin(angle) * moveSpeed;
        const nextZ = Game.player.z + Math.cos(angle) * moveSpeed;

        // Коллизии с границами
        if (Math.abs(nextX) < 13.5) Game.player.x = nextX;
        if (Math.abs(nextZ) < 13.5) Game.player.z = nextZ;

        playerMesh.position.set(Game.player.x, 0, Game.player.z);
        playerMesh.rotation.y = Game.player.rot;
    }

    // Камера следит за игроком
    camera.position.x = Game.player.x;
    camera.position.y = Game.player.z + 10;
    camera.position.z = Game.player.z + 12;
    camera.lookAt(Game.player.x, 1, Game.player.z);

    // Подсказка об интерактивности
    const near = getNearbyObject();
    const prompt = document.getElementById('interaction-prompt');
    if (near) {
        prompt.style.display = 'block';
        prompt.innerText = `[E] ${near.name.toUpperCase()}`;
    } else {
        prompt.style.display = 'none';
    }

    UI.updateHUD();
}

function getNearbyObject() {
    return interactiveMeshes.find(o => Math.hypot(o.x - Game.player.x, o.z - Game.player.z) < 2.5);
}

function checkInteraction() {
    const near = getNearbyObject();
    if (!near) return;

    if (near.type === 'bed') {
        Game.player.sanity = Math.min(100, Game.player.sanity + 20);
        Game.timeMinutes += 120;
        UI.notify('Вы поспали (+20% Рассудка)');
    } else if (near.type === 'generator') {
        Game.power = 100;
        UI.notify('Генератор полностью перезапущен!');
    } else if (near.type === 'workbench') {
        UI.toggleModal('modal-inventory');
        UI.switchInvTab('craft');
    } else if (near.type === 'radio') {
        UI.notify('📻 Шум радио: "...сигнал утерян..."');
    }
}

// --- UI РЕНДЕР И МОДАЛКИ ---
const UI = {
    updateHUD() {
        document.getElementById('hp-fill').style.width = `${Game.player.hp}%`;
        document.getElementById('hunger-fill').style.width = `${Game.player.hunger}%`;
        document.getElementById('thirst-fill').style.width = `${Game.player.thirst}%`;
        document.getElementById('sanity-fill').style.width = `${Game.player.sanity}%`;

        let hrs = Math.floor(Game.timeMinutes / 60).toString().padStart(2, '0');
        let mins = Math.floor(Game.timeMinutes % 60).toString().padStart(2, '0');
        document.getElementById('time-display').innerText = `ДЕНЬ ${Game.day} — ${hrs}:${mins}`;
        document.getElementById('power-display').innerText = `ЭЛЕКТРИЧЕСТВО: ${Math.round(Game.power)}%`;
    },
    renderHotbar() {
        const hotbar = document.getElementById('hotbar');
        hotbar.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            const slotData = Game.inventory[i];
            const item = slotData ? ITEMS[slotData.item] : null;
            const div = document.createElement('div');
            div.className = `slot ${i === Game.selectedSlot ? 'selected' : ''}`;
            div.innerHTML = `
                <span class="slot-num">${i + 1}</span>
                ${item ? `<span style="font-size: 20px;">${item.icon}</span><span class="slot-count">${slotData.count}</span>` : ''}
            `;
            hotbar.appendChild(div);
        }
    },
    renderInventory() {
        const grid = document.getElementById('inv-grid');
        grid.innerHTML = '';
        Game.inventory.forEach((slot, idx) => {
            const item = ITEMS[slot.item];
            if (!item) return;
            const div = document.createElement('div');
            div.className = `inv-item ${Game.selectedInvIndex === idx ? 'selected' : ''}`;
            div.innerHTML = `<span class="qty">x${slot.count}</span><div class="icon">${item.icon}</div><div class="name">${item.name}</div>`;
            div.onclick = () => {
                Game.selectedInvIndex = idx;
                this.renderInventory();
                document.getElementById('inv-desc').innerText = `${item.name}: ${item.desc}`;
                document.getElementById('btn-use-item').style.display = item.type !== 'mat' ? 'block' : 'none';
            };
            grid.appendChild(div);
        });
    },
    useSelectedItem() {
        if (Game.selectedInvIndex === null) return;
        const slot = Game.inventory[Game.selectedInvIndex];
        const item = ITEMS[slot.item];

        if (item.type === 'food') Game.player.hunger = Math.min(100, Game.player.hunger + item.value);
        if (item.type === 'drink') Game.player.thirst = Math.min(100, Game.player.thirst + item.value);
        if (item.type === 'mind') Game.player.sanity = Math.min(100, Game.player.sanity + item.value);

        slot.count--;
        if (slot.count <= 0) Game.inventory.splice(Game.selectedInvIndex, 1);
        Game.selectedInvIndex = null;
        document.getElementById('btn-use-item').style.display = 'none';
        this.renderInventory();
        this.renderHotbar();
    },
    switchInvTab(tab) {
        document.getElementById('tab-inv').style.display = tab === 'inv' ? 'block' : 'none';
        document.getElementById('tab-craft').style.display = tab === 'craft' ? 'block' : 'none';
        if (tab === 'craft') this.renderCrafting();
    },
    renderCrafting() {
        const list = document.getElementById('craft-list');
        list.innerHTML = '';
        CRAFT_RECIPES.forEach(rec => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = rec.name;
            btn.onclick = () => {
                let can = true;
                for (let r in rec.req) {
                    let has = Game.inventory.find(i => i.item === r);
                    if (!has || has.count < rec.req[r]) can = false;
                }
                if (can) {
                    for (let r in rec.req) {
                        Game.inventory.find(i => i.item === r).count -= rec.req[r];
                    }
                    let hasRes = Game.inventory.find(i => i.item === rec.result);
                    if (hasRes) hasRes.count++;
                    else Game.inventory.push({ item: rec.result, count: 1 });
                    UI.notify('Скрафчено!');
                    UI.renderInventory();
                    UI.renderHotbar();
                } else UI.notify('❌ Недостаточно ресурсов');
            };
            list.appendChild(btn);
        });
    },
    notify(txt) {
        const el = document.getElementById('notification');
        el.innerText = txt;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2000);
    },
    toggleModal(id) {
        const el = document.getElementById(id);
        const active = el.classList.contains('active');
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        if (!active) {
            el.classList.add('active');
            Game.paused = true;
            this.renderInventory();
        } else {
            Game.paused = false;
        }
    },
    closeModals() {
        document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
        Game.paused = false;
    }
};

// Главный цикл Three.js
let lastTime = performance.now();
function animate(time) {
    requestAnimationFrame(animate);
    const dt = (time - lastTime) / 1000;
    lastTime = time;

    updateGame(dt);
    renderer.render(scene, camera);
}

document.getElementById('btn-start').onclick = () => {
    document.getElementById('main-menu').style.display = 'none';
    init3D();
    UI.renderHotbar();
    Game.running = true;
    animate(performance.now());
};
</script>
</body>
