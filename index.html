<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Modern Wars Web</title>
  <style>
    body {
      background-color: #1a1e24;
      color: #e0e6ed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }
    .hud {
      display: flex;
      gap: 20px;
      background: #252b33;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #3a424d;
      margin-bottom: 20px;
    }
    .resource-item {
      font-weight: bold;
    }
    .main-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    .map-container {
      background: #111418;
      height: 400px;
      border-radius: 8px;
      border: 1px solid #3a424d;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
    }
    .panel {
      background: #252b33;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #3a424d;
    }
    button {
      background: #007acc;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      background: #005999;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="resource-item">Бюджет: $<span id="money">1000</span></div>
    <div class="resource-item">Энергия: <span id="energy">100</span> MW</div>
    <div class="resource-item">Заводы: <span id="factories">0</span></div>
  </div>

  <div class="main-layout">
    <div class="map-container" id="map">
      <!-- Здесь будет интерактивная карта -->
      [ Глобальная карта ]
    </div>

    <div class="panel">
      <h3>Строительство</h3>
      <p>Завод: +$50/сек. Стоимость: $200</p>
      <button id="buy-factory">Построить завод</button>
    </div>
  </div>

  <script>
    // Игровое состояние
    const state = {
      money: 1000,
      energy: 100,
      factories: 0,
      factoryCost: 200,
      incomePerFactory: 50
    };

    // Элементы DOM
    const moneyEl = document.getElementById('money');
    const energyEl = document.getElementById('energy');
    const factoriesEl = document.getElementById('factories');
    const buyFactoryBtn = document.getElementById('buy-factory');

    // Обновление UI
    function updateUI() {
      moneyEl.textContent = Math.floor(state.money);
      energyEl.textContent = state.energy;
      factoriesEl.textContent = state.factories;
    }

    // Игровой цикл (прирост денег каждую секунду)
    setInterval(() => {
      state.money += state.factories * state.incomePerFactory;
      updateUI();
    }, 1000);

    // Покупка завода
    buyFactoryBtn.addEventListener('click', () => {
      if (state.money >= state.factoryCost) {
        state.money -= state.factoryCost;
        state.factories++;
        state.factoryCost = Math.floor(state.factoryCost * 1.3); // Увеличение цены
        buyFactoryBtn.textContent = `Построить завод ($${state.factoryCost})`;
        updateUI();
      } else {
        alert('Недостаточно средств!');
      }
    });

    updateUI();
  </script>
</body>
</html>
